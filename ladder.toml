# The Claude Code ladder, L0 to L6, mapped onto this course's steps.
# Each feature names the step that uses it, and a "proof": words from one rule of that step's
# check, so a feature counts only when a check really tests it.
# A feature with planned = true has no step yet. `bun checks/ladder.ts` lists them and still
# passes. `bun checks/ladder.ts --strict` fails on them, and is the bar for a finished ladder.

