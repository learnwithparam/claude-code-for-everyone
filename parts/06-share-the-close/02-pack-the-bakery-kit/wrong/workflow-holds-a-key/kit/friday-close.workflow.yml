# The Friday close, run by GitHub on a timer. Copy this file to .github/workflows/ to use it.
# The key is a placeholder. Add the real key in the repository's secrets, never in this file.
name: Friday close
on:
  schedule:
    - cron: "0 7 * * 5"
  workflow_dispatch:
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Run the close on a copy
        env:
          ANTHROPIC_API_KEY: sk-ant-EXAMPLE-not-real
        run: claude -p "Run the Friday close. Write only to out/. Never change an original file." --allowedTools "Read" "Write"
